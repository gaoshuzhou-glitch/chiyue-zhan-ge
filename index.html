<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>赤月战歌 V1</title><style>*{box-sizing:border-box}body{margin:0;background:#120b08;color:#f6dfae;font-family:Arial,'Microsoft YaHei',sans-serif;overflow:hidden}#app{height:100vh;display:flex;flex-direction:column}.top{padding:8px 12px;background:#26130d;border-bottom:2px solid #8f5425;display:flex;justify-content:space-between;font-weight:700}.main{flex:1;display:flex;min-height:0}.scene{position:relative;flex:1;background:radial-gradient(circle at 50% 40%,#65452a 0,#352319 48%,#17100c 100%);overflow:hidden}.title{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:22px;color:#ffd77a;text-shadow:2px 2px #3a1208;font-weight:900}.player{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:52px;filter:drop-shadow(0 5px 2px #000)}.mob{position:absolute;font-size:40px;cursor:pointer;user-select:none}.mob span{display:block;font-size:11px;text-align:center;color:#fff}.log{position:absolute;left:8px;bottom:8px;width:52%;max-height:100px;overflow:hidden;background:#0008;border:1px solid #7c4b29;padding:5px;font-size:11px}.panel{width:210px;background:#1d110c;border-left:2px solid #7b4924;padding:8px;display:flex;flex-direction:column;gap:8px}.stat{background:#2a1810;padding:7px;border:1px solid #704222}.bar{height:10px;background:#351313;margin-top:4px}.hp{height:100%;background:#c33}.xp{height:100%;background:#d59a24}.skills{display:grid;grid-template-columns:1fr 1fr;gap:6px}.skills button,.ctrl button{background:#4a2817;color:#ffe2a5;border:1px solid #a66a2f;border-radius:6px;padding:9px;font-weight:700}.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.ctrl button:nth-child(1){grid-column:2}.ctrl button:nth-child(4){grid-column:2}.bottom{padding:6px;background:#160d09;border-top:2px solid #7b4924;font-size:12px;text-align:center}@media(max-width:600px){.panel{width:170px}.title{font-size:18px}.player{font-size:44px}.mob{font-size:32px}}
</style></head><body><div id="app"><div class="top"><div>⚔️ 赤月战歌 V1</div><div id="lv">Lv.1 烈刃</div></div><div class="main"><div class="scene" id="scene"><div class="title">苍狼荒原</div><div class="player" id="player">🧑‍⚔️</div><div class="log" id="log">欢迎来到赤月战歌！<br>点击怪物开始战斗。</div></div><aside class="panel"><div class="stat">❤️ HP <b id="hpText">100/100</b><div class="bar"><div class="hp" id="hp"></div></div></div><div class="stat">⭐ EXP <b id="xpText">0/100</b><div class="bar"><div class="xp" id="xp"></div></div></div><div class="stat">💰 金币 <b id="gold">0</b></div><div class="stat">🎒 装备<br><span id="gear">荒原铁剑</span></div><div class="skills"><button onclick="attack()">⚔️ 普攻</button><button onclick="skill(1)">🌪️ 旋风斩</button><button onclick="skill(2)">🔥 烈焰斩</button><button onclick="skill(3)">😡 狂暴</button></div><div class="ctrl"><button onclick="move(0,-1)">⬆️</button><button onclick="move(-1,0)">⬅️</button><button onclick="move(1,0)">➡️</button><button onclick="move(0,1)">⬇️</button></div></aside></div><div class="bottom">V1 单机测试版 · 击杀怪物 → 升级 → 掉装备 → 挑战 Boss</div></div><script>let lv=1,hp=100,maxHp=100,xp=0,gold=0,px=50,py=52,enemies=[];const scene=document.getElementById('scene'),logEl=document.getElementById('log');function log(t){logEl.innerHTML=t+'<br>'+logEl.innerHTML}function ui(){document.getElementById('lv').textContent='Lv.'+lv+' 烈刃';document.getElementById('hpText').textContent=hp+'/'+maxHp;document.getElementById('xpText').textContent=xp+'/100';document.getElementById('gold').textContent=gold;document.getElementById('hp').style.width=(hp/maxHp*100)+'%';document.getElementById('xp').style.width=xp+'%';document.getElementById('player').style.left=px+'%';document.getElementById('player').style.top=py+'%'}function spawn(name,emoji,boss=false){let e=document.createElement('div');e.className='mob';e.innerHTML=emoji+'<span>'+name+(boss?' 👑':'')+'</span>';e.style.left=(15+Math.random()*70)+'%';e.style.top=(15+Math.random()*65)+'%';e.onclick=()=>fight(e,name,boss);scene.appendChild(e);enemies.push(e)}function fight(e,name,boss){let dmg=8+Math.floor(Math.random()*8);if(boss)dmg=14+Math.floor(Math.random()*10);let dead=Math.random()>.28;hp=Math.max(1,hp-dmg);log('你攻击了 '+name+'，受到 '+dmg+' 点伤害。');if(dead){let gain=boss?70:18;xp+=gain;gold+=boss?200:20+Math.floor(Math.random()*30);e.remove();log('击败 '+name+'！获得经验和金币。');if(Math.random()>.55){let gs=['荒原铁剑','狼皮护腕','旅者项链','精良战靴'];document.getElementById('gear').textContent=gs[Math.floor(Math.random()*gs.length)];log('🎁 掉落装备！')}if(xp>=100){xp-=100;lv++;maxHp+=25;hp=maxHp;log('🎉 升级！你现在 Lv.'+lv);if(lv===5){spawn('苍狼王','🐺',true);log('⚠️ 苍狼王出现了！')}}}ui()}function attack(){if(enemies[0])fight(enemies[0],'目标',false);else log('附近没有怪物。')}function skill(n){if(n===3){hp=Math.min(maxHp,hp+30);log('狂暴：恢复 30 HP！')}else{let bonus=n===2?25:15;xp+=bonus;gold+=5;log('技能命中！获得额外奖励。');if(xp>=100){xp-=100;lv++;maxHp+=25;hp=maxHp;log('🎉 升级！')} }ui()}function move(dx,dy){px=Math.max(5,Math.min(95,px+dx*4));py=Math.max(8,Math.min(88,py+dy*4));ui()}for(let i=0;i<5;i++)spawn(['苍狼','荒原鬼卒','血蝠'][i%3],['🐺','👹','🦇'][i%3]);ui();</script></body></html>
